<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>科技创新期末精准测试台</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    max-width: 700px; 
    margin: 2rem auto; 
    text-align: center; 
    background-color: #f4f4f9; 
    color: #333;
    line-height: 1.6;
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .mode-switch { font-size: 1rem; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: white; cursor: pointer; }
  .card { 
    background: white; 
    border-radius: 12px; 
    padding: 2.5rem 2rem; 
    box-shadow: 0 8px 16px rgba(0,0,0,0.08); 
    min-height: 250px; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    margin-bottom: 1.5rem;
  }
  .question { font-size: 1.3rem; font-weight: bold; margin-bottom: 1.5rem; color: #1a1a1a; text-align: left;}
  .content-area { font-size: 1.1rem; color: #444; text-align: left; border-top: 2px dashed #eee; padding-top: 1.5rem; }
  
  /* 背诵模式的高亮样式 */
  .highlight { color: #d93025; font-weight: bold; background-color: #fce8e6; padding: 2px 4px; border-radius: 4px; }
  
  /* 测试模式的输入框样式 */
  .cloze-input { font-size: 1rem; padding: 4px; margin: 0 4px; border: 1px solid #007aff; border-radius: 4px; outline: none; width: 120px; text-align: center; }
  .cloze-input.correct { border-color: #34c759; background-color: #e8f5e9; color: #1e8e3e; font-weight: bold; }
  .cloze-input.wrong { border-color: #d93025; background-color: #fce8e6; color: #d93025; }

  .controls button { 
    padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; 
    background-color: #007aff; color: white; font-size: 1rem; font-weight: 500; transition: 0.2s;
  }
  .controls button:hover { background-color: #005bb5; }
  .controls .check-btn { background-color: #ff9500; }
  .controls .check-btn:hover { background-color: #d97d00; }
  .progress { color: #666; font-size: 1rem; font-weight: bold;}
</style>
</head>
<body>
  <div class="header">
    <div class="progress">进度: <span id="current-idx">1</span> / 19</div>
    <select id="mode-selector" class="mode-switch" onchange="renderCard()">
      <option value="recite">📖 背诵模式 (显示答案)</option>
      <option value="test">✍️ 测试模式 (挖空填空)</option>
    </select>
  </div>
  
  <div class="card">
    <div class="question" id="question-text">题目加载中...</div>
    <div class="content-area" id="content-area">内容加载中...</div>
  </div>
  
  <div class="controls">
    <button onclick="prevCard()">⬅️ 上一题</button>
    <button onclick="checkAnswers()" class="check-btn" id="check-btn" style="display:none;">✔️ 核对答案</button>
    <button onclick="nextCard()">下一题 ➡️</button>
  </div>

  <script>
    const examData = [
      { q: '科技强国的内涵是什么？', text: '应当具有居于世界前列的科技实力和创新能力，支撑经济实力、国防实力、综合国力整体跃升，增进人类福祉，推动全球发展。', blanks: ['科技实力', '创新能力', '经济实力', '国防实力', '综合国力', '人类福祉'] },
      { q: '科技强国必须具备的基本要素有哪些？', text: '一是拥有强大的基础研究和原始创新能力。二是拥有强大的关键核心技术攻关能力。三是拥有强大的国际影响力和引领力。四是拥有强大的高水平科技人才培养和集聚能力。五是拥有强大的科技治理体系和治理能力。', blanks: ['基础研究', '原始创新', '关键核心技术', '国际影响力', '科技人才培养', '科技治理体系'] },
      { q: '建设科技强国有哪些实现路径？', text: '第一，充分发挥新型举国体制优势，加快推进高水平科技自立自强。第二，扎实推动科技创新和产业创新深度融合，助力发展新质生产力。第三，全面深化科技体制机制改革，充分激发创新创造活力。第四，一体推进教育科技人才事业发展，构筑人才竞争优势。第五，深入践行构建人类命运共同体理念，推动科技开放合作。', blanks: ['新型举国体制', '科技自立自强', '新质生产力', '科技体制机制改革', '教育科技人才', '人类命运共同体'] },
      { q: '科技强国建设的实践逻辑是什么？', text: '集中体现在两个维度：一是外部压力下的生存与竞争逻辑，即面对大变局与技术封锁，必须走自主创新之路，实现科技自立自强。二是内部需求下的发展与可持续逻辑，即转变依靠资源要素投入的粗放型发展方式，通过创新驱动提高全要素生产率，实现高质量发展。', blanks: ['外部压力', '自主创新', '科技自立自强', '内部需求', '粗放型发展方式', '全要素生产率'] },
      { q: '科技创新系统观包含哪些理论内涵？', text: '首先，创新是一种价值实现过程，需完成从科学研究到推广应用的三级跳。其次，科技成果要面向经济社会发展主战场和人民群众新需求，转化为人民福祉。再次，创新是以科技创新为核心的全面创新。最后，创新是一种新的发展理念，须把科技创新摆在国家发展全局的核心位置。', blanks: ['价值实现过程', '人民福祉', '全面创新', '发展理念', '核心位置'] },
      { q: '深刻理解自主创新的内涵及分类？', text: '内涵：在对外开放条件下，立足自身形成具有自主知识产权的核心技术，最终实现关键核心技术自主可控、科技自立自强的过程。包含三个层次：原始创新、集成创新和引进消化吸收再创新。', blanks: ['对外开放', '自主知识产权', '自主可控', '科技自立自强', '原始创新', '集成创新', '引进消化吸收再创新'] },
      { q: '基础研究的内涵是什么？', text: '是为获得关于客观现象和可观察的事实的基本原理的新知识所进行的实验性或理论性工作，它不以任何近期专门或具体的应用或使用为目的。', blanks: ['基本原理', '新知识', '近期专门', '具体'] },
      { q: '什么是科技创新制高点？', text: '通常是指前沿领域的最高点、创新链条上的关键点、创新体系中的控制点。其核心特征是竞争性、排他性、优先性。失去科技制高点就难免会被卡脖子。', blanks: ['前沿领域', '创新链条', '创新体系', '竞争性', '排他性', '优先性', '卡脖子'] },
      { q: '科技创新的模式分类有哪些？', text: '技术推动模式、需求拉动模式、技术与市场交互作用模式、一体化模式、网络模式。', blanks: ['技术推动', '需求拉动', '交互作用', '一体化', '网络'] },
      { q: '简述科学与技术的区别？', text: '目的不同：科学是为了认识自然，技术是为了改造自然。过程不同：科学是由实践到认识，技术是由认识到实践。形态不同：科学呈现为知识形态，技术呈现为物化形态。评价标准不同：科学评价真理性（是与非），技术评价价值性（好与坏）。作用不同：科学影响长远且不确定，技术影响近期且确定。', blanks: ['认识自然', '改造自然', '实践到认识', '知识', '物化', '真理性', '价值性'] },
      { q: '科研选题的根本原则有哪些？', text: '需求性：立足国家战略与产业痛点。创新性：力求实现从0到1的突破，避免低水平重复。科学性：建立在坚实的科学基础之上，遵循科学规范并可被验证。可行性：综合评估技术积累、团队能力和研究条件，跳一跳够得着。', blanks: ['需求性', '国家战略', '创新性', '0到1', '科学性', '科学基础', '可行性', '研究条件'] },
      { q: '创新的风险性包含哪些？', text: '指创新系统的复杂性使实际结果和预期发生背离，并导致利益损失的可能性。主要包括技术风险、财务风险、生产风险、组织风险、市场风险、社会风险、政策风险、自然风险等。', blanks: ['复杂性', '发生背离', '技术', '财务', '生产', '组织', '市场', '社会', '政策', '自然'] },
      { q: '怎么看待天津市大力建设“天开高教科创园”？', text: '实质是提高天津市区域创新体系的整体效能。关键是加强技术创新服务体系建设，深化科技成果转化机制改革，加快概念验证、中试验证平台布局，完善长期资本支持政策以降低创新风险和成本。', blanks: ['区域创新体系', '整体效能', '技术创新服务体系', '科技成果转化', '概念验证', '中试验证'] },
      { q: '如何理解负责任的研究和创新？', text: '科学技术是一把双刃剑，人类完全有理由把高尚的道德标准置于客观真理的发现者之上。负责任创新应当承载人类命运共同体的发展理念，在追求经济、社会、生态价值的基础上，实现以人民为中心的人本价值，将科技成果转化为人民福祉。', blanks: ['双刃剑', '道德标准', '客观真理', '人类命运共同体', '人本价值', '人民福祉'] },
      { q: '全球科技治理的内涵是什么？', text: '指国际社会通过规则、规范、制度和程序，共同管理引导全球科技的发展与应用。主体包括主权国家、国际组织、跨国公司等多元主体。客体涵盖技术标准、知识产权、科研伦理、应对全球挑战等。', blanks: ['规则', '规范', '制度', '程序', '主权国家', '国际组织', '跨国公司'] },
      { q: '如何理解“统筹发展和安全”的深刻内涵？', text: '辩证统一：安全是发展的前提，发展是安全的保障，二者是有机整体。发展是指通过开放合作汇聚创新资源，提升科技创新能力。安全是指动态有效维护国家科技安全，保障关键核心技术自主可控。精髓在于把握好度，避免一管就死和一放就乱。', blanks: ['前提', '保障', '有机整体', '开放合作', '动态有效', '自主可控', '把握好度', '一管就死'] },
      { q: '如何正确认识教育、科技、人才是驱动创新的三驾马车？', text: '第一，必须坚持教育优先发展，加快建设高质量教育体系。第二，必须坚持创新驱动，健全新型举国体制，推进关键核心技术攻关。第三，必须坚持人才是第一资源，提高自主培养质量并聚天下英才而用之。', blanks: ['教育优先发展', '创新驱动', '新型举国体制', '人才是第一资源', '自主培养质量'] },
      { q: '强化基础研究的重点举措有哪些？', text: '1. 强化基础研究前瞻性、战略性、系统性布局。2. 深化基础研究体制机制改革。3. 建设基础研究高水平支撑平台。4. 加强基础研究人才队伍建设。5. 广泛开展基础研究国际合作。6. 塑造有利于基础研究的创新生态。', blanks: ['前瞻性', '战略性', '系统性', '体制机制改革', '支撑平台', '创新生态'] },
      { q: '科学家精神的具体内涵是什么？', text: '胸怀祖国、服务人民的爱国精神。勇攀高峰、敢为人先的创新精神。追求真理、严谨治学的求实精神。淡泊名利、潜心研究的奉献精神。集智攻关、团结协作的协同精神。甘为人梯、奖掖后学的育人精神。', blanks: ['爱国精神', '创新精神', '求实精神', '奉献精神', '协同精神', '育人精神'] }
    ];

    let currentIndex = 0;

    function renderCard() {
      const data = examData[currentIndex];
      const mode = document.getElementById('mode-selector').value;
      
      document.getElementById('current-idx').innerText = currentIndex + 1;
      document.getElementById('question-text').innerText = data.q;
      
      const contentArea = document.getElementById('content-area');
      const checkBtn = document.getElementById('check-btn');
      
      let htmlText = data.text;

      if (mode === 'recite') {
        checkBtn.style.display = 'none';
        data.blanks.forEach(blank => {
          const regex = new RegExp(blank, 'g');
          htmlText = htmlText.replace(regex, `<span class="highlight">${blank}</span>`);
        });
      } else {
        checkBtn.style.display = 'inline-block';
        data.blanks.forEach((blank, idx) => {
          const regex = new RegExp(blank, 'g');
          htmlText = htmlText.replace(regex, `<input type="text" class="cloze-input" data-answer="${blank}" id="input-${idx}">`);
        });
      }
      
      contentArea.innerHTML = htmlText;
    }

    function checkAnswers() {
      const inputs = document.querySelectorAll('.cloze-input');
      inputs.forEach(input => {
        const correctAns = input.getAttribute('data-answer');
        if (input.value.trim() === correctAns) {
          input.classList.remove('wrong');
          input.classList.add('correct');
        } else {
          input.classList.remove('correct');
          input.classList.add('wrong');
        }
      });
    }

    function nextCard() { currentIndex = (currentIndex + 1) % examData.length; renderCard(); }
    function prevCard() { currentIndex = (currentIndex - 1 + examData.length) % examData.length; renderCard(); }

    renderCard();
  </script>
</body>
</html>
